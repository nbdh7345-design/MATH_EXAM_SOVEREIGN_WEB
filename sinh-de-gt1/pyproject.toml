[project]
name = "sinhde"
version = "0.1.0"
description = "Sinh đề bài Giải tích 1 có chứng nhận Lean (thiết kế v1.2)"
requires-python = ">=3.11"
dependencies = [
  "lark>=1.2",
  "pydantic>=2.7",
  "sympy>=1.13",
  "mpmath>=1.3",
  "scipy>=1.13",
  "filelock>=3.15",
  "typer>=0.12",
  "pyyaml>=6.0",
  "interegular>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
]

[project.scripts]
sinhde = "sinhde.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sinhde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "lean: cần Lean (chạy trong sandbox)",
  "sandbox: cần Docker",
]
addopts = "-m 'not lean and not sandbox'"
